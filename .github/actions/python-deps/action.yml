name: Python dependencies
description: Checkout is assumed; installs requirements.txt on Python 3.12

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt
