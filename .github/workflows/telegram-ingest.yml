name: Daily Telegram scrape & enrich

# telegram_scraper.py → ingest, enrich, classify, refresh (in-script)
# Then refresh again + revalidate Vercel for the Next.js Data Cache.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_missing:
        description: "Full-history backfill for channels with no watermark"
        type: boolean
        default: false
      enrich_limit:
        description: "Max repos to enrich this run"
        type: string
        default: "200"

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_CHANNELS: githubtrending,github_repos,github_repositories_bds
      TELEGRAM_SESSION: telegram_scraper
      INGEST_BATCH_SIZE: "100"
      ENRICH_CONCURRENCY: "3"
      ENRICH_DELAY_SECONDS: "1.5"
      ENRICH_BATCH_SIZE: "200"
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: ./.github/actions/python-deps

      - name: Restore Telethon session
        uses: ./.github/actions/telegram-session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

      - name: Run daily multi-channel pipeline
        run: |
          EXTRA=""
          if [ "${{ inputs.backfill_missing }}" = "true" ]; then
            EXTRA="--backfill-missing"
          fi
          LIMIT="${{ inputs.enrich_limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=200; fi
          python telegram_scraper.py --enrich-limit "$LIMIT" $EXTRA

      - name: Post-pipeline refresh and publish
        if: ${{ !cancelled() }}
        uses: ./.github/actions/post-pipeline

      - name: Cleanup session artifacts
        if: always()
        run: rm -f telegram_scraper.session telegram_scraper.session-journal
