name: GitHub stars enrich backfill

# scripts/github_enricher.py → classify → refresh → revalidate

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max repos to enrich this run"
        type: string
        default: "400"
      classify_limit:
        description: "Max repos to classify (default 2× enrich limit)"
        type: string
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENRICH_CONCURRENCY: "3"
      ENRICH_DELAY_SECONDS: "1.5"
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: ./.github/actions/python-deps

      - name: Enrich pending repositories
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=400; fi
          echo "Enriching up to $LIMIT repos…"
          python scripts/github_enricher.py --limit "$LIMIT"

      - name: Classify categories
        if: ${{ !cancelled() }}
        run: |
          EL="${{ inputs.limit }}"
          CL="${{ inputs.classify_limit }}"
          if [ -z "$EL" ]; then EL=400; fi
          if [ -z "$CL" ]; then CL=$(( EL * 2 )); fi
          python scripts/classify_categories.py --limit "$CL"

      - name: Post-pipeline refresh and publish
        if: ${{ !cancelled() }}
        uses: ./.github/actions/post-pipeline
