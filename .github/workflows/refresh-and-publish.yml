name: Refresh read models and publish site

# Keeps materialized views and the Vercel Data Cache aligned between enrich runs.

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: ./.github/actions/python-deps

      - name: Post-pipeline refresh and publish
        uses: ./.github/actions/post-pipeline
