name: Classify repository categories

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max repos to classify"
        type: string
        default: "800"

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: ./.github/actions/python-deps

      - name: Run classification
        run: |
          L="${{ inputs.limit }}"
          if [ -z "$L" ]; then L=800; fi
          python scripts/classify_categories.py --limit "$L"

      - name: Post-pipeline refresh and publish
        if: ${{ !cancelled() }}
        uses: ./.github/actions/post-pipeline
